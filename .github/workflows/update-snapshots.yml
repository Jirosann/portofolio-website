name: Update visual baselines

# Memperbarui baseline regresi visual di Linux lalu meng-commit PNG ke branch yang dipilih.
# Alternatif lokal tanpa workflow: npm run test:e2e:update (Docker).
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch yang baseline-nya diperbarui (bukan main)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: update-snapshots-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Image yang sama dengan e2e.yml dan scripts/e2e-docker.mjs agar baseline identik.
    # Versinya harus sama dengan @playwright/test di package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
      CI: true
      PUPPETEER_SKIP_DOWNLOAD: 1
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      # Input dibaca lewat env, bukan ${{ }} di dalam skrip, agar nama branch tidak bisa menyisipkan perintah.
      BRANCH: ${{ inputs.branch }}
    steps:
      - name: Tolak main
        run: |
          if [ "$BRANCH" = "main" ]; then
            echo "::error::Baseline tidak di-commit langsung ke main. Pilih branch fitur."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run build

      # changed: hanya baseline yang melewati ambang (atau belum ada) yang ditulis ulang, jadi PNG lain tidak ikut berubah.
      - run: npx playwright test visual.spec.ts --update-snapshots=changed

      - name: Commit dan push baseline
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "Tidak ada baseline yang berubah di \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "Baseline yang diperbarui di \`$BRANCH\`:"
            echo
            git diff --cached --name-only | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          git commit -m "test(e2e): perbarui baseline visual"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Laporan HTML
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
